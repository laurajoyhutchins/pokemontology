name: Bug report
description: Report a reproducible implementation, ontology, query, or documentation defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private replay URLs, personal data, game dumps, or copyrighted source material.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal synthetic inputs and commands.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation output
