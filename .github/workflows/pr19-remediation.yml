name: PR 19 publication remediation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/pr19-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/public-repository-ip-provenance
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply current-tree remediation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from textwrap import dedent

          def replace_top_level_node(path: Path, predicate, replacement: str) -> None:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              node = next((candidate for candidate in tree.body if predicate(candidate)), None)
              if node is None or node.end_lineno is None:
                  raise SystemExit(f"target was not found in {path}")
              lines = source.splitlines(keepends=True)
              replacement_lines = dedent(replacement).strip("\n").splitlines(keepends=True)
              replacement_text = "\n".join(line.rstrip("\n") for line in replacement_lines) + "\n"
              lines[node.lineno - 1 : node.end_lineno] = [replacement_text]
              path.write_text("".join(lines), encoding="utf-8")

          replace_top_level_node(
              Path("tests/test_cli.py"),
              lambda node: isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "REPLAY_JSON"
                  for target in node.targets
              ),
              '''
              REPLAY_JSON = REPO / "examples" / "fixtures" / "synthetic-battle.json"
              ''',
          )

          replace_top_level_node(
              Path("pokemontology/replay/replay_dataset.py"),
              lambda node: isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "_write_bundle_from_slices",
              '''
              def _write_bundle_from_slices(bundle_path: Path, slice_paths: list[Path]) -> None:
                  bundle_path.parent.mkdir(parents=True, exist_ok=True)
                  prefixes: set[str] = set()
                  bodies: list[str] = []

                  for slice_path in slice_paths:
                      body_lines: list[str] = []
                      with slice_path.open("r", encoding="utf-8") as infile:
                          for line in infile:
                              if line.startswith("@prefix"):
                                  prefixes.add(line.rstrip("\\n"))
                              else:
                                  body_lines.append(line)
                      bodies.append("".join(body_lines).rstrip())

                  with bundle_path.open("w", encoding="utf-8") as outfile:
                      for prefix in sorted(prefixes):
                          outfile.write(f"{prefix}\\n")
                      outfile.write("\\n")
                      for body in bodies:
                          if body:
                              outfile.write(body)
                              outfile.write("\\n\\n")
              ''',
          )
          PY
      - name: Install project dependencies
        run: python -m pip install .
      - name: Rebuild generated artifacts
        run: python -m pokemontology build
      - name: Validate publication policy
        run: python scripts/validate_publication.py
      - name: Run CLI tests
        run: python -m pytest -q tests/test_cli.py
      - name: Run replay-dataset tests
        run: python -m pytest -q tests/test_replay_dataset.py
      - name: Run publication-policy tests
        run: python -m pytest -q tests/test_publication_policy.py
      - name: Check current replay paths
        run: |
          if git grep -n '/ "replays"' -- tests/test_cli.py tests/test_replay_dataset.py; then
            echo "Legacy replay fixture path remains in current tests" >&2
            exit 1
          fi
      - name: Stage regenerated artifacts
        run: |
          git add -u
          git diff --cached --check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete publication remediation"
      - name: Push remediation
        run: git push origin HEAD:chore/public-repository-ip-provenance
