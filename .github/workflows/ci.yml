name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ontology: ${{ steps.filter.outputs.ontology }}
      docs: ${{ steps.filter.outputs.docs }}
      python: ${{ steps.filter.outputs.python }}
      queries: ${{ steps.filter.outputs.queries }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            ontology:
              - 'ontology/**'
              - 'shapes/**'
              - 'data/**'
              - 'examples/**'
              - 'MANIFEST.json'
              - 'DATA_SOURCES.md'
              - 'THIRD_PARTY_NOTICES.md'
            docs:
              - 'docs/**'
              - 'README.md'
            python:
              - 'pokemontology/**'
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements.txt'
            queries:
              - 'queries/**'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/pull_request_template.md'
              - '.github/CODEOWNERS'

  publication-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project dependencies
        run: python -m pip install .
      - name: Validate attribution and publication policy
        run: python scripts/validate_publication.py
      - name: Run publication policy tests
        run: python -m pytest tests/test_publication_policy.py
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit

  build-contract:
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ontology == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.queries == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project dependencies
        run: python -m pip install .
      - name: Rebuild generated artifacts
        run: python -m pokemontology build
      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- \
            build/ontology.ttl \
            build/shapes.ttl \
            build/schema-index.json \
            docs/ontology.ttl \
            docs/shapes.ttl \
            docs/site-data.json \
            docs/schema-index.json \
            docs/mechanics-base.ttl \
            docs/mechanics-learnsets-current.ttl \
            docs/mechanics-learnsets-modern.ttl \
            docs/mechanics-learnsets-legacy.ttl

  published-ttl-size:
    name: Published TTL size (${{ matrix.path }})
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ontology == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.workflows == 'true'
    strategy:
      fail-fast: false
      matrix:
        path:
          - docs/ontology.ttl
          - docs/shapes.ttl
          - docs/mechanics-base.ttl
          - docs/mechanics-learnsets-current.ttl
          - docs/mechanics-learnsets-modern.ttl
          - docs/mechanics-learnsets-legacy.ttl
          - docs/pokeapi-demo.ttl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce size budget for ${{ matrix.path }}
        env:
          ARTIFACT_PATH: ${{ matrix.path }}
        run: |
          size=$(stat -c%s "$ARTIFACT_PATH")
          mib=$(python -c 'import sys; print(f"{int(sys.argv[1]) / (1024 * 1024):.2f}")' "$size")
          echo "$ARTIFACT_PATH: ${mib} MiB"
          if [ "$size" -gt $((90 * 1024 * 1024)) ]; then
            echo "::error file=$ARTIFACT_PATH::Published Turtle artifact exceeds hard limit of 90 MiB (${mib} MiB)"
            exit 1
          fi
          if [ "$size" -gt $((50 * 1024 * 1024)) ]; then
            echo "::warning file=$ARTIFACT_PATH::Published Turtle artifact exceeds warning limit of 50 MiB (${mib} MiB)"
          fi

  fast-regressions:
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name != 'pull_request' ||
      needs.changes.outputs.ontology == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.queries == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project dependencies
        run: python -m pip install .
      - name: CLI regressions
        run: python -m pytest --tb=short --junitxml=cli-junit.xml tests/test_cli.py
      - name: Upload CLI regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-junit
          path: cli-junit.xml
          if-no-files-found: error
          retention-days: 3
      - name: Turn-order regressions
        run: python -m pytest --tb=short tests/test_turn_order.py
      - name: Site-asset regressions
        run: python -m pytest --tb=short tests/test_build_site_assets.py
      - name: Query-engine regressions
        run: python -m pytest --tb=short tests/test_docs_query_engine.py
      - name: End-to-end regressions
        run: python -m pytest --tb=short tests/test_e2e.py
